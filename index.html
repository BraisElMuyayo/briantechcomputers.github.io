
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Technology Computers</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    header { background: #731010; color: white; padding: 1rem 2rem; display: flex; align-items: center; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header img { height: 70px; margin-right: 1rem; }
    .btn { background: #731010; color: white; border: none; padding: 0.5rem 1rem; margin: 0.2rem; border-radius: 6px; cursor: pointer; }
    .catalogo, .admin-panel { padding: 1rem; }
    .servicio { background: white; padding: 1rem; margin: 1rem 0; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    #carrito, #formulario, #adminPanel { margin: 2rem; }
    input { padding: 0.5rem; width: 100%; margin-bottom: 0.5rem; }
    iframe { width: 100%; height: 600px; border: none; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <h1>Brian Technology Computers</h1>
  </header>

  <section>
    <div id="filtrosCategorias"></div>
    <div id="catalogo"></div>
  </section>

  <section id="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="formulario" style="display:none;">
    <h2>Formulario de contacto</h2>
    <ul id="resumenServicios"></ul>
    <button class="btn" onclick="copiarResumen()">Copiar servicios</button>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfMwYVpVz07Fr4CKfXrp6AlZAjbOy6F_jpsINSuoAVolzA2rw/viewform?embedded=true"></iframe>
  </section>

  <section class="admin-panel">
    <h2>Acceso administrador</h2>
    <input id="adminUser" placeholder="Usuario">
    <input id="adminPass" placeholder="Contraseña" type="password">
    <button class="btn" onclick="loginAdmin()">Entrar</button>
    <div id="adminPanel" style="display:none;">
      <input id="nuevoCatalogo" placeholder="Nuevo catálogo">
      <button class="btn" onclick="crearCatalogo()">Crear catálogo</button>
      <div id="panelCatalogos"></div>
    </div>
  </section>

  <script>
    let catalogos = {
      "Ciberseguridad": [
        { nombre: "Instalación Antivirus", descripcion: "Instalación y configuración", precio: "30€" }
      ],
      "Reparación": [
        { nombre: "Formateo", descripcion: "Formateo completo del sistema", precio: "25€" }
      ]
    };

    function renderCatalogo(filtro = '') {
      const contenedor = document.getElementById("catalogo");
      contenedor.innerHTML = "";
      const cats = filtro ? { [filtro]: catalogos[filtro] } : catalogos;
      for (let cat in cats) {
        const div = document.createElement("div");
        div.innerHTML = `<h3>${cat}</h3>`;
        cats[cat].forEach((s) => {
          const card = document.createElement("div");
          card.className = "servicio";
          card.innerHTML = `<strong>${s.nombre}</strong><p>${s.descripcion}</p><p>Precio: ${s.precio}</p><button class="btn" onclick="agregarAlCarrito('${s.nombre}')">Agregar al carrito</button>`;
          div.appendChild(card);
        });
        contenedor.appendChild(div);
      }
    }

    function generarFiltros() {
      const cont = document.getElementById("filtrosCategorias");
      cont.innerHTML = "";
      const btn = document.createElement("button");
      btn.textContent = "Ver todos";
      btn.className = "btn";
      btn.onclick = () => renderCatalogo();
      cont.appendChild(btn);
      for (let cat in catalogos) {
        const b = document.createElement("button");
        b.textContent = cat;
        b.className = "btn";
        b.onclick = () => renderCatalogo(cat);
        cont.appendChild(b);
      }
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      document.getElementById("listaCarrito").appendChild(li);
      const resumen = document.createElement("li");
      resumen.textContent = nombre;
      document.getElementById("resumenServicios").appendChild(resumen);
      
    document.getElementById("formulario").style.display = "block";
    const resumen = document.getElementById("resumenServicios");
    const item = document.createElement("li");
    item.textContent = nombre;
    resumen.appendChild(item);
    
    }

    function copiarResumen() {
      const items = Array.from(document.querySelectorAll("#resumenServicios li")).map(li => li.textContent).join("\n");
      navigator.clipboard.writeText(items);
      alert("Servicios copiados");
    }

    function loginAdmin() {
      if (document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "admin123") {
        document.getElementById("adminPanel").style.display = "block";
        renderPanelAdmin();
      } else {
        alert("Credenciales incorrectas");
      }
    }

    function crearCatalogo() {
      const nombre = document.getElementById("nuevoCatalogo").value;
      if (!nombre || catalogos[nombre]) return;
      catalogos[nombre] = [];
      renderCatalogo();
      generarFiltros();
      renderPanelAdmin();
    }

    function agregarServicio(cat) {
      const n = document.getElementById(`n-${cat}`).value;
      const d = document.getElementById(`d-${cat}`).value;
      const p = document.getElementById(`p-${cat}`).value + "€";
      catalogos[cat].push({ nombre: n, descripcion: d, precio: p });
      renderCatalogo();
      renderPanelAdmin();
    }

    function editarServicio(cat, i) {
      const n = document.getElementById(`editn-${cat}-${i}`).value;
      const d = document.getElementById(`editd-${cat}-${i}`).value;
      const p = document.getElementById(`editp-${cat}-${i}`).value + "€";
      catalogos[cat][i] = { nombre: n, descripcion: d, precio: p };
      renderCatalogo();
      renderPanelAdmin();
    }

    function eliminarServicio(cat, i) {
      if (confirm("¿Eliminar este servicio?")) {
        catalogos[cat].splice(i, 1);
        renderCatalogo();
        renderPanelAdmin();
      }
    }

    function renderPanelAdmin() {
      const cont = document.getElementById("panelCatalogos");
      cont.innerHTML = "";
      for (let cat in catalogos) {
        const div = document.createElement("div");
        div.innerHTML = `<h4>${cat}</h4>
          <input id="n-${cat}" placeholder="Nombre"><input id="d-${cat}" placeholder="Descripción">
          <input id="p-${cat}" placeholder="Precio"><button class="btn" onclick="agregarServicio('${cat}')">Añadir</button>`;
        catalogos[cat].forEach((s, i) => {
          div.innerHTML += `
            <div>
              <input id="editn-${cat}-${i}" value="${s.nombre}">
              <input id="editd-${cat}-${i}" value="${s.descripcion}">
              <input id="editp-${cat}-${i}" value="${s.precio.replace('€','')}">
              <button class="btn" onclick="editarServicio('${cat}',${i})">Guardar</button>
              <button class="btn" onclick="eliminarServicio('${cat}',${i})">Eliminar</button>
            </div>`;
        });
        cont.appendChild(div);
      }
    }

    generarFiltros();
    renderCatalogo();
  </script>
</body>
</html>
