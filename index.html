<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Technology Computers</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #fff;
      color: #333;
    }
    header {
      background-color: #731010;
      color: white;
      padding: 1rem;
      display: flex;
      align-items: center;
    }
    header img {
      height: 60px;
      margin-right: 1rem;
    }
    nav {
      text-align: center;
      padding: 1rem;
    }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #731010;
      font-weight: bold;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .servicio {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
    }
    .servicio h3 {
      color: #731010;
    }
    .btn {
      background-color: #731010;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .carrito, .formulario, .login {
      padding: 2rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <div>
      <h1>Brian Technology Computers</h1>
      <p>Ciberseguridad y Sistemas</p>
    </div>
  </header>

  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#carrito">Carrito</a>
    <a href="#contacto">Contacto</a>
    <a href="#login">Login</a>
  </nav>

  <section id="catalogo" class="catalogo"></section>

  <section id="carrito" class="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="contacto" class="formulario">
    <h2>Formulario de contacto</h2>
    <form>
      <label>Nombre:<br><input type="text" required></label><br><br>
      <label>Email:<br><input type="email" required></label><br><br>
      <label>Mensaje:<br><textarea rows="4" cols="50" required></textarea></label><br><br>
      <button class="btn">Enviar solicitud</button>
    </form>
  </section>

  <section id="login" class="login">
    <h2>Iniciar Sesión</h2>
    <label>Usuario: <input id="user" type="text" /></label><br><br>
    <label>Contraseña: <input id="pass" type="password" /></label><br><br>
    <button class="btn" onclick="login()">Entrar</button>
  </section>

  <section id="adminPanel" class="formulario hidden">
    <h2>Panel de Administración</h2>
    <label>Nombre del nuevo servicio:<br><input id="nuevoNombre" type="text" /></label><br><br>
    <label>Descripción:<br><input id="nuevaDesc" type="text" /></label><br><br>
    <button class="btn" onclick="agregarServicio()">Agregar Servicio</button>
  </section>

  <script>
    const servicios = [
      { nombre: "Instalación de Sistemas Operativos", descripcion: "Formateo e instalación completa." },
      { nombre: "Seguridad Informática", descripcion: "Antivirus, firewall, y configuración segura." },
      { nombre: "Mantenimiento Preventivo", descripcion: "Limpieza, optimización y actualizaciones." }
    ];

    const catalogo = document.getElementById("catalogo");
    const carrito = document.getElementById("listaCarrito");

    function renderServicios() {
      catalogo.innerHTML = "";
      servicios.forEach(serv => {
        const div = document.createElement("div");
        div.className = "servicio";
        div.innerHTML = `<h3>${serv.nombre}</h3><p>${serv.descripcion}</p><button class='btn' onclick='agregarAlCarrito("${serv.nombre}")'>Agregar al carrito</button>`;
        catalogo.appendChild(div);
      });
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      carrito.appendChild(li);
    }

    function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      if (u === "admin" && p === "admin123") {
        document.getElementById("adminPanel").classList.remove("hidden");
        alert("Bienvenido, administrador.");
      } else {
        alert("Login fallido.");
      }
    }

    function agregarServicio() {
      const nombre = document.getElementById("nuevoNombre").value;
      const desc = document.getElementById("nuevaDesc").value;
      servicios.push({ nombre, descripcion: desc });
      renderServicios();
      alert("Servicio agregado.");
    }

    renderServicios();
  </script>
</body>
</html>
