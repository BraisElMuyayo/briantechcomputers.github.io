
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brian Technology Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #f8f8f8; margin: 0; }
    header { background: #731010; color: white; display: flex; align-items: center; padding: 1rem 2rem; }
    header img { height: 100px; margin-right: 1rem; }
    nav { background: #fff; text-align: center; padding: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    nav a { margin: 0 15px; color: #731010; text-decoration: none; font-weight: bold; }
    section { padding: 2rem; }
    .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    .servicio { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .servicio h3 { margin-top: 0; color: #731010; }
    .precio { font-weight: bold; color: #444; }
    .btn { margin-top: 0.5rem; padding: 0.5rem 1rem; background: #731010; color: white; border: none; border-radius: 5px; cursor: pointer; }
    input, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 5px; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <div>
      <h1>Brian Technology Computers</h1>
      <p>Ciberseguridad y Sistemas</p>
    </div>
  </header>

  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#carrito">Carrito</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="catalogo" class="catalogo"></section>

  <section id="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="contacto">
    <h2>Formulario de contacto</h2>
    <form action="https://formsubmit.co/briantechcomputers@gmail.com" method="POST" onsubmit="return copiarCarrito()">
      <label>Nombre:<input type="text" name="name" required></label>
      <label>Email:<input type="email" name="email" required></label>
      <label>Mensaje adicional:<textarea name="message" required></textarea></label>
      <input type="hidden" name="services" id="serviciosSeleccionados">
      <input type="hidden" name="_next" value="https://briantechcomputers.github.io/gracias.html">
      <button class="btn" type="submit">Enviar</button>
    </form>
  </section>

  <script>
    let servicios = [
      { nombre: "Instalación de SO", descripcion: "Formateo e instalación completa", precio: "30€" },
      { nombre: "Antivirus y Seguridad", descripcion: "Protección contra malware", precio: "40€" },
      { nombre: "Mantenimiento", descripcion: "Limpieza interna y optimización", precio: "25€" }
    ];

    function renderServicios() {
      const contenedor = document.getElementById("catalogo");
      contenedor.innerHTML = "";
      servicios.forEach((s) => {
        const div = document.createElement("div");
        div.className = "servicio";
        div.innerHTML = `<h3>${s.nombre}</h3><p>${s.descripcion}</p><p class="precio">Precio: ${s.precio}</p><button class="btn" onclick="agregarAlCarrito('${s.nombre}')">Agregar al carrito</button>`;
        contenedor.appendChild(div);
      });
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      document.getElementById("listaCarrito").appendChild(li);
    }

    function copiarCarrito() {
      const carritoItems = Array.from(document.getElementById("listaCarrito").children).map(li => li.textContent);
      document.getElementById("serviciosSeleccionados").value = carritoItems.join(", ");
      return true;
    }

    renderServicios();
  </script>
</body>
</html>
