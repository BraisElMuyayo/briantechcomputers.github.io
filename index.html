    header { background: #731010; color: white; padding: 1rem; display: flex; align-items: center; justify-content: space-between; }
    header img { height: 80px; }
    .container { padding: 1rem; max-width: 1000px; margin: auto; }
    .categoria { margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .servicio { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { padding: 0.5rem 1rem; background: #731010; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 0.2rem; }
    h2, h3 { color: #731010; }
    input, select { padding: 0.5rem; margin: 0.3rem 0; width: 100%; }
    iframe { width: 100%; height: 600px; border: none; }
  </style>
</head>

    <img src="logo.png" alt="Logo" />

    <section id="formulario" style="display:none;">
      <h2>Formulario de contacto</h2>
      <ul id="resumenServicios"></ul>
      <button class="btn" onclick="copiarResumen()">Copiar servicios</button>
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfMwYVpVz07Fr4CKfXrp6AlZAjbOy6F_jpsINSuoAVolzA2rw/viewform?embedded=true">Cargando…</iframe>
    </section>

    <section id="admin">
      <h2>Panel Administrador</h2>
      <input id="adminUser" placeholder="Usuario">
      <input id="adminPass" type="password" placeholder="Contraseña">
      <button class="btn" onclick="loginAdmin()">Entrar</button>

      <div id="adminPanel" style="display:none;">
        <input id="nuevaCategoria" placeholder="Nueva categoría">
        <button class="btn" onclick="crearCategoria()">Crear categoría</button>
        <div id="panelCatalogos"></div>
      </div>
    </section>
  </div>

    let carrito = [];

    function renderCatalogo() {
      const cont = document.getElementById("catalogo");
      cont.innerHTML = "";
      for (let cat in catalogos) {
        const div = document.createElement("div");
        div.className = "categoria";
        div.innerHTML = `<h3>${cat}</h3>`;
        const grid = document.createElement("div");
        grid.className = "grid";
        catalogos[cat].forEach((s, i) => {
          const card = document.createElement("div");
          card.className = "servicio";
          card.innerHTML = `<strong>${s.nombre}</strong><p>${s.descripcion}</p><p>${s.precio}</p>
          <button class="btn" onclick="agregarAlCarrito('${s.nombre}')">Agregar al carrito</button>`;
          grid.appendChild(card);
        });
        div.appendChild(grid);
        cont.appendChild(div);
      }
    }

    function renderAdminPanel() {
      const cont = document.getElementById("panelCatalogos");
      cont.innerHTML = "";
      for (let cat in catalogos) {
        const div = document.createElement("div");
        div.innerHTML = `<h4>${cat}</h4>
          <button class='btn' onclick="renombrarCategoria('${cat}')">Renombrar</button>
          <input id="n-${cat}" placeholder="Nombre">
          <input id="d-${cat}" placeholder="Descripción">
          <input id="p-${cat}" placeholder="Precio">
          <button class="btn" onclick="agregarServicio('${cat}')">Añadir servicio</button>`;
        catalogos[cat].forEach((s, i) => {
          div.innerHTML += `<div>
            <input id="en-${cat}-${i}" value="${s.nombre}">
            <input id="ed-${cat}-${i}" value="${s.descripcion}">
            <input id="ep-${cat}-${i}" value="${s.precio}">
            <button class="btn" onclick="editarServicio('${cat}', ${i})">Guardar</button>
            <button class="btn" onclick="eliminarServicio('${cat}', ${i})">Eliminar</button>
          </div>`;
        });
        cont.appendChild(div);
      }
    }

    function agregarServicio(cat) {
      const n = document.getElementById(`n-${cat}`).value;
      const d = document.getElementById(`d-${cat}`).value;
      const p = document.getElementById(`p-${cat}`).value;
      if (n && d && p) {
        catalogos[cat].push({ nombre: n, descripcion: d, precio: p });
        renderCatalogo();
        renderAdminPanel();
      }
    }

    function editarServicio(cat, i) {
      const n = document.getElementById(`en-${cat}-${i}`).value;
      const d = document.getElementById(`ed-${cat}-${i}`).value;
      const p = document.getElementById(`ep-${cat}-${i}`).value;
      catalogos[cat][i] = { nombre: n, descripcion: d, precio: p };
      renderCatalogo();
      renderAdminPanel();
    }

    function eliminarServicio(cat, i) {
      if (confirm("¿Eliminar servicio?")) {
        catalogos[cat].splice(i, 1);
        renderCatalogo();
        renderAdminPanel();
      }
    }

    function renombrarCategoria(cat) {
      const nuevo = prompt("Nuevo nombre para la categoría:", cat);
      if (nuevo && nuevo !== cat && !catalogos[nuevo]) {
        catalogos[nuevo] = catalogos[cat];
        delete catalogos[cat];
        renderCatalogo();
        renderAdminPanel();
      }
    }

    function crearCategoria() {
      const nombre = document.getElementById("nuevaCategoria").value;
      if (nombre && !catalogos[nombre]) {
        catalogos[nombre] = [];
        renderCatalogo();
        renderAdminPanel();
      }
    }

    function loginAdmin() {
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;
      if (u === "admin" && p === "admin123") {
        document.getElementById("adminPanel").style.display = "block";
        renderAdminPanel();
      } else {
        alert("Credenciales incorrectas");
      }
    }

    function agregarAlCarrito(nombre) {
      carrito.push(nombre);
      actualizarCarrito();
    }

    function vaciarCarrito() {
      carrito = [];
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById("listaCarrito");
      const resumen = document.getElementById("resumenServicios");
      lista.innerHTML = "";
      resumen.innerHTML = "";
      carrito.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        lista.appendChild(li);
        const li2 = document.createElement("li");
        li2.textContent = item;
        resumen.appendChild(li2);
      });
      document.getElementById("formulario").style.display = carrito.length ? "block" : "none";
    }

    function copiarResumen() {
      const texto = carrito.join("\n");
      navigator.clipboard.writeText(texto);
      alert("Servicios copiados");
    }

    renderCatalogo();
  </script>
