
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brian Technology Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      color: #333;
    }
    header {
      background-color: #731010;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
    }
    header img {
      height: 100px;
      margin-right: 1rem;
    }
    nav {
      background-color: #fff;
      text-align: center;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #731010;
      font-weight: bold;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }
    .servicio {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .servicio h3 {
      margin-top: 0;
      color: #731010;
    }
    .precio {
      font-weight: bold;
      color: #444;
    }
    .btn {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: #731010;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background: #500c0c;
    }
    section {
      padding: 2rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <div>
      <h1>Brian Technology Computers</h1>
      <p>Ciberseguridad y Sistemas</p>
    </div>
  </header>

  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#carrito">Carrito</a>
    <a href="#admin">Admin</a>
  </nav>

  <section id="catalogo" class="catalogo"></section>

  <section id="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="formulario">
    <h2>Formulario de contacto</h2>
    <form id="contact-form">
      <label>Nombre:<input type="text" id="nombre" required></label>
      <label>Email:<input type="email" id="email" required></label>
      <label>Mensaje adicional:<textarea id="mensaje"></textarea></label>
      <button class="btn" type="submit">Enviar</button>
      <p id="respuesta"></p>
    </form>
  </section>

  <section id="admin">
    <h2>Panel de administrador</h2>
    <label>Usuario:<input type="text" id="adminUser"></label>
    <label>Contraseña:<input type="password" id="adminPass"></label>
    <button class="btn" onclick="loginAdmin()">Entrar</button>

    <div id="adminPanel" class="hidden">
      <h3>Agregar nuevo servicio</h3>
      <input type="text" id="nuevoNombre" placeholder="Nombre">
      <input type="text" id="nuevaDesc" placeholder="Descripción">
      <input type="text" id="nuevoPrecio" placeholder="Precio (€)">
      <button class="btn" onclick="agregarServicio()">Agregar</button>
      <ul id="listaAdmin"></ul>
    </div>
  </section>

  <script>
    let servicios = [
      { nombre: "Instalación de SO", descripcion: "Formateo e instalación completa", precio: "30€" },
      { nombre: "Antivirus y Seguridad", descripcion: "Protección contra malware", precio: "40€" },
      { nombre: "Mantenimiento", descripcion: "Limpieza interna y optimización", precio: "25€" }
    ];

    function renderServicios() {
      const contenedor = document.getElementById("catalogo");
      contenedor.innerHTML = "";
      servicios.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "servicio";
        div.innerHTML = `<h3>${s.nombre}</h3><p>${s.descripcion}</p><p class="precio">Precio: ${s.precio}</p><button class="btn" onclick="agregarAlCarrito('${s.nombre}')">Agregar al carrito</button>`;
        contenedor.appendChild(div);
      });
      renderAdminList();
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      document.getElementById("listaCarrito").appendChild(li);
    }

    function loginAdmin() {
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;
      if (u === "admin" && btoa(p) === "YWRtaW4xMjM=") {
        document.getElementById("adminPanel").classList.remove("hidden");
        renderAdminList();
      } else {
        alert("Credenciales incorrectas");
      }
    }

    function agregarServicio() {
      const nombre = document.getElementById("nuevoNombre").value;
      const descripcion = document.getElementById("nuevaDesc").value;
      const precio = document.getElementById("nuevoPrecio").value + "€";
      servicios.push({ nombre, descripcion, precio });
      renderServicios();
    }

    function renderAdminList() {
      const lista = document.getElementById("listaAdmin");
      if (!lista) return;
      lista.innerHTML = "";
      servicios.forEach((s, i) => {
        const item = document.createElement("li");
        item.innerHTML = `${s.nombre} - <button onclick="eliminarServicio(${i})">Eliminar</button>`;
        lista.appendChild(item);
      });
    }

    function eliminarServicio(index) {
      if (confirm("¿Eliminar este servicio?")) {
        servicios.splice(index, 1);
        renderServicios();
      }
    }

    document.getElementById("contact-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const mensaje = document.getElementById("mensaje").value;
      const carritoItems = Array.from(document.getElementById("listaCarrito").children).map(li => li.textContent);
      const servicios = carritoItems.join(", ");
      fetch("https://formspree.io/f/xldbjjrq", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, email, mensaje, servicios })
      }).then(r => {
        document.getElementById("respuesta").textContent = r.ok ? "Enviado correctamente." : "Error al enviar.";
      });
    });

    renderServicios();
  </script>
<script>
document.getElementById("contact-form").addEventListener("submit", function(e) {
  e.preventDefault();
  const name = document.getElementById("nombre").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("mensaje").value;
  const carritoItems = Array.from(document.getElementById("listaCarrito").children).map(li => li.textContent);
  const services = carritoItems.join(", ");
  fetch("https://formspree.io/f/xldbjjrq", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, message, services })
  }).then(r => {
    document.getElementById("respuesta").style.color = r.ok ? "green" : "red";
    document.getElementById("respuesta").textContent = r.ok ? "Mensaje enviado correctamente." : "Error al enviar. Verifica los datos.";
  });
});
</script>
</body>
</html>
