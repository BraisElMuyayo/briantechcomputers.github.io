
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Technology Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      color: #333;
    }
    header {
      background-color: #731010;
      color: white;
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
    }
    header img {
      height: 100px;
      margin-right: 1rem;
    }
    nav {
      background: #fff;
      text-align: center;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #731010;
      font-weight: bold;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }
    .servicio {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .servicio h3 {
      margin-top: 0;
      color: #731010;
    }
    .precio {
      font-weight: bold;
      color: #444;
    }
    .btn {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: #731010;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      max-width: 800px;
      height: 900px;
      border: none;
      margin: auto;
      display: block;
    }
    #formulario {
      display: none;
      padding: 2rem;
    }
    #resumenServicios {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <div>
      <h1>Brian Technology Computers</h1>
      <p>Ciberseguridad y Sistemas</p>
    </div>
  </header>

  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#carrito">Carrito</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="catalogo" class="catalogo"></section>

  <section id="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="formulario">
    <h2>Formulario de contacto</h2>
    <div id="resumenServicios">
      <strong>Servicios seleccionados:</strong>
      <ul id="resumenLista"></ul>
      <p>Por favor, copia estos servicios en el campo correspondiente del formulario.</p>
    </div>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfMwYVpVz07Fr4CKfXrp6AlZAjbOy6F_jpsINSuoAVolzA2rw/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Cargando…</iframe>
  </section>

  <script>
    let servicios = [
      { nombre: "Instalación de SO", descripcion: "Formateo e instalación completa", precio: "30€" },
      { nombre: "Antivirus y Seguridad", descripcion: "Protección contra malware", precio: "40€" },
      { nombre: "Mantenimiento", descripcion: "Limpieza interna y optimización", precio: "25€" }
    ];

    function renderServicios() {
      const contenedor = document.getElementById("catalogo");
      contenedor.innerHTML = "";
      servicios.forEach((s) => {
        const div = document.createElement("div");
        div.className = "servicio";
        div.innerHTML = `<h3>${s.nombre}</h3><p>${s.descripcion}</p><p class="precio">Precio: ${s.precio}</p><button class="btn" onclick="agregarAlCarrito('${s.nombre}')">Agregar al carrito</button>`;
        contenedor.appendChild(div);
      });
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      document.getElementById("listaCarrito").appendChild(li);

      const resumenItem = document.createElement("li");
      resumenItem.textContent = nombre;
      document.getElementById("resumenLista").appendChild(resumenItem);

      document.getElementById("formulario").style.display = "block";
    }

    renderServicios();
  </script>
</body>
</html>
