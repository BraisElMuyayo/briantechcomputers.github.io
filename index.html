
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian Technology Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      color: #333;
    }
    header {
      background-color: #731010;
      color: white;
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
    }
    header img {
      height: 100px;
      margin-right: 1rem;
    }
    nav {
      background: #fff;
      text-align: center;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #731010;
      font-weight: bold;
    }
    section {
      padding: 2rem;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .servicio {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .servicio h3 {
      margin-top: 0;
      color: #731010;
    }
    .precio {
      font-weight: bold;
    }
    .btn {
      background-color: #731010;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    #formulario {
      display: none;
    }
    #resumenServicios {
      background: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
      max-width: 800px;
      margin: 1rem auto;
    }
    iframe {
      width: 100%;
      max-width: 800px;
      height: 900px;
      border: none;
      margin: auto;
      display: block;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .admin-panel {
      background: #fff4f4;
      margin-top: 2rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <div>
      <h1>Brian Technology Computers</h1>
      <p>Ciberseguridad y Sistemas</p>
    </div>
  </header>

  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#carrito">Carrito</a>
    <a href="#admin">Admin</a>
  </nav>

  <section id="catalogo" class="catalogo"></section>

  <section id="carrito">
    <h2>Carrito de servicios</h2>
    <ul id="listaCarrito"></ul>
  </section>

  <section id="formulario">
    <div id="resumenServicios">
      <strong>Servicios seleccionados:</strong>
      <ul id="resumenLista"></ul>
      <button class="btn" onclick="copiarResumen()">Copiar al portapapeles</button>
    </div>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfMwYVpVz07Fr4CKfXrp6AlZAjbOy6F_jpsINSuoAVolzA2rw/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Cargando…</iframe>
  </section>

  <section id="admin" class="admin-panel">
    <h2>Iniciar sesión como administrador</h2>
    <input type="text" id="adminUser" placeholder="Usuario" />
    <input type="password" id="adminPass" placeholder="Contraseña" />
    <button class="btn" onclick="loginAdmin()">Entrar</button>

    <div id="adminPanel" class="hidden">
      <h3>Agregar nuevo servicio</h3>
      <input id="nuevoNombre" placeholder="Nombre del servicio" />
      <input id="nuevaDesc" placeholder="Descripción" />
      <input id="nuevoPrecio" placeholder="Precio (€)" />
      <button class="btn" onclick="agregarServicio()">Agregar servicio</button>
      <ul id="listaServiciosAdmin"></ul>
    </div>
  </section>

  <script>
    let servicios = [
      { nombre: "Instalación de SO", descripcion: "Formateo e instalación completa", precio: "30€" },
      { nombre: "Antivirus y Seguridad", descripcion: "Protección contra malware", precio: "40€" },
      { nombre: "Mantenimiento", descripcion: "Limpieza interna y optimización", precio: "25€" }
    ];

    function renderServicios() {
      const cont = document.getElementById("catalogo");
      cont.innerHTML = "";
      servicios.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "servicio";
        div.innerHTML = `<h3>${s.nombre}</h3><p>${s.descripcion}</p><p class='precio'>Precio: ${s.precio}</p><button class='btn' onclick='agregarAlCarrito("${s.nombre}")'>Agregar al carrito</button>`;
        cont.appendChild(div);
      });
      renderAdminList();
    }

    function agregarAlCarrito(nombre) {
      const li = document.createElement("li");
      li.textContent = nombre;
      document.getElementById("listaCarrito").appendChild(li);

      const resumenItem = document.createElement("li");
      resumenItem.textContent = nombre;
      document.getElementById("resumenLista").appendChild(resumenItem);

      document.getElementById("formulario").style.display = "block";
    }

    function copiarResumen() {
      const items = Array.from(document.getElementById("resumenLista").children).map(li => li.textContent).join("\n");
      navigator.clipboard.writeText(items);
      alert("Servicios copiados al portapapeles.");
    }

    function loginAdmin() {
      const u = document.getElementById("adminUser").value;
      const p = document.getElementById("adminPass").value;
      if (u === "admin" && btoa(p) === "YWRtaW4xMjM=") {
        document.getElementById("adminPanel").classList.remove("hidden");
        renderAdminList();
        alert("Bienvenido administrador.");
      } else {
        alert("Credenciales incorrectas.");
      }
    }

    function agregarServicio() {
      const nombre = document.getElementById("nuevoNombre").value;
      const descripcion = document.getElementById("nuevaDesc").value;
      const precio = document.getElementById("nuevoPrecio").value + "€";
      servicios.push({ nombre, descripcion, precio });
      renderServicios();
    }

    function renderAdminList() {
      const lista = document.getElementById("listaServiciosAdmin");
      if (!lista) return;
      lista.innerHTML = "";
      servicios.forEach((s, i) => {
        const item = document.createElement("li");
        item.innerHTML = `${s.nombre} - <button onclick="eliminarServicio(${i})">Eliminar</button>`;
        lista.appendChild(item);
      });
    }

    function eliminarServicio(index) {
      if (confirm("¿Eliminar este servicio?")) {
        servicios.splice(index, 1);
        renderServicios();
      }
    }

    renderServicios();
  </script>
</body>
</html>
